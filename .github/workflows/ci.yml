name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # shellcheck lints, it does not parse: run both. bash -n parses only its
      # first file and takes the rest as arguments, so loop, reporting every file.
      - run: rc=0; for f in hooks/*.sh tests/*.sh; do bash -n "$f" || rc=1; done; exit $rc
      - run: shellcheck hooks/*.sh tests/*.sh
      - run: tests/test-prompt-submit.sh
