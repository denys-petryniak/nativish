name: CI

# push is limited to main: with `on: [push, pull_request]` every job runs twice
# on a branch that has a PR open, once per event.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # macOS system bash is 3.2, which is what the hooks target and the oldest
      # thing anyone runs. bash is backward compatible, so 3.2 is the strict
      # subset — passing here covers bash 5 too, and one job says it.
      #
      # Asserted, not just printed: if the image stops shipping 3.2, this must
      # fail rather than quietly pass with the coverage gone.
      - name: bash version
        run: |
          /bin/bash --version | head -1
          major=$(/bin/bash -c 'echo "${BASH_VERSINFO[0]}"')
          [ "$major" = 3 ] || {
            echo "::error::expected bash 3 on macos-latest, got $major"
            exit 1
          }

      # Not the same check as shellcheck: shellcheck once passed a file that
      # bash 3.2 refused to load, because an apostrophe in a heredoc nested in
      # $( ) breaks 3.2's paren scanning. Only the real interpreter sees that.
      - name: parse
        run: |
          for f in hooks/*.sh tests/*.sh; do
            /bin/bash -n "$f"
          done

      - name: unit suite
        run: /bin/bash tests/test-prompt-submit.sh

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck hooks/*.sh tests/*.sh

      - name: shfmt
        env:
          SHFMT_VERSION: v3.10.0
        run: |
          curl -fsSL -o /tmp/shfmt \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          chmod +x /tmp/shfmt
          /tmp/shfmt --version
          /tmp/shfmt -i 2 -ci -d hooks/*.sh tests/*.sh

      # The release process needs plugin.json and marketplace.json to carry the
      # same version. They have drifted before a tag more than once.
      - name: manifest versions in sync
        run: |
          plugin=$(python3 -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          market=$(python3 -c "import json;print(json.load(open('.claude-plugin/marketplace.json'))['metadata']['version'])")
          echo "plugin.json=$plugin marketplace.json=$market"
          [ "$plugin" = "$market" ] || { echo "::error::version mismatch"; exit 1; }
